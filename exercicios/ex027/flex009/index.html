<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box</title>
    <style>
        .container {
            background-color: lightsalmon;
            display: flex;
            flex-flow: row wrap;
        }

        .item {
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            flex-basis: 150px; /* Não é um valor fixo. Caso o container pai diminua, o valor de 150px dos itens pode ser alterado também */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">
            A
        </div>
        <div class="item">
            Outro conteúdo
        </div>
        <div class="item">
            C
        </div>
        <div class="item">
            Conteúdo um pouco maior
        </div>
        <div class="item">
            E
        </div>
    </div>
</body>
</html>
