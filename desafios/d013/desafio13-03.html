<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 3 - tabelas</title>
    <style>
        table {
            font-family: Arial, Helvetica, sans-serif;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        .cinza {
            background-color: grey;
            color: white;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <table>
        <thead>
            <tr>
                <th rowspan="2" class="cinza" scope="col">Área</th>
                <th rowspan="2" class="cinza" scope="col">Disciplinas</th>
                <th colspan="2" class="cinza" scope="colgroup">Notas</th>
                <th rowspan="2" class="cinza" scope="col">Média</th>
            </tr>
            <tr>
                <td class="cinza">Nota 1</td>
                <td class="cinza">Nota 2</td>
            </tr>
        </thead>
        <tbody>
            <th rowspan="5" scope="rowgroup">Exatas</th>
            <tr>
                <td>Matemática</td>
                <td>9.0</td>
                <td>6.0</td>
                <td>7.5</td>
            </tr>
            <tr>
                <td>Física</td>
                <td>5.0</td>
                <td>6.0</td>
                <td>5.5</td>
            </tr>
            <tr>
                <td>Química</td>
                <td>9.0</td>
                <td>8.0</td>
                <td>8.5</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td>3.0</td>
                <td>7.0</td>
                <td>5.0</td>
            </tr>
            <tr>
                <td class="cinza" colspan="4">Média de exatas</td>
                <td class="cinza">6.6</td>
            </tr>

            <th rowspan="3" scope="rowgroup">Humanas</th>
            <tr>
                <td>História</td>
                <td>7.0</td>
                <td>10.0</td>
                <td>8.5</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td>5.5</td>
                <td>5.5</td>
                <td>5.5</td>
            </tr>
            <tr>
                <td class="cinza" colspan="4">Média de Humanas</td>
                <td class="cinza">7.0</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
